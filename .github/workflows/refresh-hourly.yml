name: Refresh market data

on:
  schedule:
    - cron: "0 0,12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          command: python -m pip install -r ml/requirements.txt

      - name: Refresh market artifacts
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 30
          command: python ml/refresh.py

      - name: Verify data actually advanced
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import sys
          import pandas as pd

          stale_threshold_hours = 36
          paths = ["data/BTC-USD/hourly.parquet", "data/BTC-USD/daily.parquet"]
          now = datetime.now(timezone.utc)
          stale = []
          for path in paths:
              df = pd.read_parquet(path, columns=["open_time"])
              latest = pd.to_datetime(df["open_time"]).max().to_pydatetime()
              if latest.tzinfo is None:
                  latest = latest.replace(tzinfo=timezone.utc)
              age = now - latest
              print(f"{path}: latest {latest.isoformat()} (age {age})")
              if age > timedelta(hours=stale_threshold_hours):
                  stale.append(f"{path} is {age} old")
          if stale:
              print("STALE DATA after refresh:", *stale, sep="\n  ")
              sys.exit(1)
          print("Both artifacts are within the freshness window.")
          PY

      - name: Commit and push changed data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh market data [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
          fi
